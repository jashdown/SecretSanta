# Apache site for Patton Secret Santa, behind Cloudflare.
# Install: sudo cp /opt/patton-secret-santa/deploy/santa.justinashdown.com.conf /etc/apache2/sites-available/
#          sudo a2ensite santa.justinashdown.com
#
# If you change the host name, also change allowedActionOrigins in
# react-router.config.ts and rebuild, or every form will fail with "Bad Request".
<VirtualHost *:443>
    ServerName santa.justinashdown.com

    # Cloudflare Origin Certificate (Cloudflare dashboard: SSL/TLS > Origin Server).
    # One made for *.justinashdown.com covers this site and any other subdomain.
    SSLEngine on
    SSLCertificateFile    /etc/ssl/cloudflare/justinashdown.com.pem
    SSLCertificateKeyFile /etc/ssl/cloudflare/justinashdown.com.key

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog  ${APACHE_LOG_DIR}/santa-error.log
    CustomLog ${APACHE_LOG_DIR}/santa-access.log combined
</VirtualHost>
